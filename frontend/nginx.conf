server {
    listen 80;
    server_name _;
    # Keep this aligned with UPLOAD_MAX_BYTES.  The outer host Nginx, when
    # used, must allow at least the same request-body size as well.
    client_max_body_size 20m;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS lets Nginx reconnect after the backend is recreated.
    resolver 127.0.0.11 ipv6=off valid=10s;

    location /api/ {
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 650s;
        proxy_send_timeout 650s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
